name: easy_pomodoro
description: Easy Pomodoro — offline-first Flutter companion.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^19.3.0
  audioplayers: ^6.5.0
  wakelock_plus: ^1.3.2
  google_fonts: ^6.2.1
  intl: ^0.20.2
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/icon/
    - assets/google_fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#FFF9F4"
  adaptive_icon_foreground: assets/icon/app_icon.png